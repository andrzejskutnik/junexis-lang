; platformio.ini — developer-owned embedded build override.
;
; Junexis generates a default out/embedded/platformio.ini, but when this file
; exists it is copied over the generated PlatformIO config during project build.
; Edit this file when the project needs custom libraries, flags, monitor speed,
; board options or upload settings.

[platformio]
src_dir = .
include_dir = .

[env:junexis]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
build_unflags = -std=gnu++11 -std=gnu++14 -std=gnu++17
build_flags = -std=gnu++2a -I.
lib_deps =
    bblanchon/ArduinoJson@^6.21.5

