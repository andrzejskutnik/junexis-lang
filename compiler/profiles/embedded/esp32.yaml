# Classic ESP32 Platform Profile
# Dual-core Xtensa microcontroller used by the PlatformIO esp32dev target.

version: "1.0"
platform: "@embedded"
variant: "esp32"

capabilities:
  threading: true
  fileIO: false
  networking: true
  async: false
  dynamicAllocation: true
  realTimeClock: true
  hardwareInterrupts: true

limits:
  maxMemoryBytes: 532480 # 520 KB SRAM
  maxConcurrentTasks: 32

metadata:
  description: "Classic ESP32 dual-core Xtensa microcontroller (WiFi, Bluetooth)"
  manufacturer: "Espressif Systems"
  architecture: "Xtensa LX6"
  frequency: "240MHz"
  releaseYear: 2016

hardware:
  ram: "520 KB SRAM"
  flash: "4 MB (typical external)"
  wifi: "802.11 b/g/n"
  bluetooth: "Bluetooth 4.2 BR/EDR and BLE"

recommended:
  useCases:
    - "General-purpose IoT gateways and sensors"
    - "WiFi and Bluetooth devices"
    - "PlatformIO esp32dev prototypes"
  notRecommended:
    - "Hard real-time workloads without a dedicated scheduling analysis"
